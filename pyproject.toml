[project]
name = "trab6"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.162.4",
    "grpcio>=1.85.1",
    "grpcio-tools>=1.85.1",
    "gunicorn>=27.0.0",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "requests>=2.34.2",
    "spyne>=2.14.0",
    "strawberry-graphql>=0.341.2",
    "uvicorn[standard]>=0.54.0",
    "zeep>=4.3.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["testes"]
